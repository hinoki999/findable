# EAS Workflow: typecheck and lint gate
# Runs on every push to develop. Builds and OTA updates are started manually,
# so this workflow only reports whether the code typechecks and lints cleanly.

# Workflow name (displayed in Expo dashboard)
name: Typecheck and lint

# Trigger: Run this workflow when code is pushed to develop
on:
  push:
    branches:
      - develop

jobs:
  checks:
    name: Typecheck and lint
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
